<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Reset Password | VisionTech Solutions™</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script type="module" src="../js/admin/password-reset.js"></script>
  </head>
  <body>
    <main class="admin-login-shell">
      <section class="admin-login-card" aria-labelledby="reset-title">
        <a class="wordmark admin-login-brand" href="../index.html">
          <img class="brand-logo" src="../assets/images/logo/visiontech-vt-logo.png" alt="" width="61" height="48">
          <span class="brand-name">VisionTech <small>Solutions™</small></span>
        </a>
        <p class="eyebrow">Private administration</p>
        <h1 id="reset-title">Choose a new password.</h1>
        <p>Use the password reset link sent to your authorized account email.</p>
        <form id="password-reset-form" class="admin-form">
          <label for="new-password">New password</label>
          <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
          <p id="password-reset-status" class="admin-status" role="status" aria-live="polite"></p>
          <button class="button button-primary" type="submit">Update password</button>
        </form>
        <a class="admin-return-link" href="index.html">Return to admin sign in</a>
      </section>
    </main>
  </body>
</html>
